services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mentor_test
      POSTGRES_PASSWORD: isolated_test_only
      POSTGRES_DB: mentor_test
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mentor_test -d mentor_test']
      interval: 1s
      timeout: 3s
      retries: 30
